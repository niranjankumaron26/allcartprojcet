{% if orders %}<div class="table-wrap panel"><table><thead><tr><th>Order</th>{% if area=='admin' %}<th>Customer</th>{% endif %}<th>Placed</th><th>Status</th><th>Total</th></tr></thead><tbody>{% for o in orders %}<tr><td><a href="{{ url_for(area ~ '.order',order_id=o.id) }}">#{{ o.id }}</a></td>{% if area=='admin' %}<td>{{ o.customer }}</td>{% endif %}<td>{{ o.created_at.strftime('%d %b %Y') }}</td><td><span class="pill">{{ o.status }}</span></td><td>{{ money(o.total) }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<p>No orders yet.</p>{% endif %}
